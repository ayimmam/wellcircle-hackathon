<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreatRun Running Clubs – Telegram Mini App preview</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#111318;--mut:#555b6a;--amber:#f5a623;--amber-d:#d98405;--peach:#fdeedd;--peach-b:#f8d9b4;--orange:#f59a3c;--line:#e7e9f0;--sh:0 4px 16px rgba(20,24,40,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2028;--ink:#f3f4f7;--mut:#a9afbd;--peach:#3a2a17;--peach-b:#5a4122;--line:#2c303b;--sh:none}}
*{box-sizing:border-box}html,body{margin:0}
body{background:#dfe2ea;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){body{background:#0b0c10}}
.stage{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;padding:24px 12px 40px}
.col{width:min(390px,100%)}
.lab{font-weight:700;font-size:14px;margin:0 4px 10px;color:var(--ink)}.lab span{color:var(--amber-d)}
.phone{position:relative;height:800px;max-height:calc(100vh - 80px);min-height:620px;background:var(--bg);border-radius:34px;border:9px solid #1a1c22;overflow:hidden;box-shadow:0 14px 40px rgba(20,24,40,.25)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:14px;background:#e9ecf3;color:#222;height:36px}.tg b{font-size:15px}
@media (prefers-color-scheme:dark){.tg{background:#242833;color:#eee}}
.scroll{position:absolute;inset:36px 0 0 0;overflow-y:auto;padding-bottom:110px}
header{background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:50%;background:#1a1206;border:3px solid #c8901c;color:#f5c04a;display:grid;place-items:center;font:700 20px Georgia,serif}
.brand b{display:block;letter-spacing:.12em;font-size:15px}.brand small{color:var(--amber);font-weight:700;letter-spacing:.08em;font-size:10px}
.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--ink);font-size:18px}
.pad{padding:0 12px}
.hello{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 10px}.hello h3{margin:0;font-size:24px}.hello p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pts{background:var(--peach);border:1px solid var(--peach-b);color:var(--amber);font-weight:800;border-radius:999px;padding:8px 14px;font-size:14px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.ban img{display:block;width:100%;height:128px;object-fit:cover;object-position:center 60%}
.ban .t{padding:14px 16px 16px}.ban h4{margin:0 0 4px;font-size:18px;line-height:1.25}.ban p{margin:0 0 12px;color:var(--mut);font-size:14px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;text-align:center;text-decoration:none;background:var(--amber);color:#111318;font:700 15px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:0;cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--amber);color:var(--ink)}
.sel{padding:14px 16px}.sel .l{font-weight:700;font-size:13px;color:var(--mut);margin-bottom:8px;letter-spacing:.03em}
.trig{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 14px 6px 8px;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;font:600 16px inherit;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left}
.trig[aria-expanded=true]{border-color:var(--amber)}.trig .c{margin-left:auto;color:var(--amber-d);font-size:14px}
.trig .ph0{padding-left:8px;color:var(--mut)}
.th{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:#000}
.list{margin-top:8px;display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;font:600 15.5px inherit;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:12.5px;margin-top:2px}.opt.on{background:var(--peach);border-color:var(--peach-b)}
.back{background:none;border:0;color:var(--amber-d);font:700 15px inherit;font-family:inherit;min-height:44px;padding:0 14px;cursor:pointer}
.hero{width:100%;height:170px;object-fit:cover;display:block;background:#000}
.body{padding:16px 18px 18px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--peach);border:1px solid var(--peach-b);color:var(--orange);font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px}
h2{margin:0 0 6px;font-size:22px}.desc{color:var(--mut);line-height:1.5;margin:0 0 14px;font-size:15px}
.rows{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px;font-size:14.5px}
.rows li{display:grid;grid-template-columns:88px 1fr;gap:8px;line-height:1.4}.rows .k{font-weight:700}.rows .v{color:var(--mut)}
.walk{background:var(--peach);border:1px solid var(--peach-b);border-radius:16px;padding:14px;margin:0 0 16px}
.walk h3{margin:0 0 4px;font-size:16px}.walk .n{margin:0 0 10px;font-size:13px;color:var(--mut);line-height:1.4}.walk .rows{font-size:14px;margin-bottom:12px}.walk .rows li{grid-template-columns:78px 1fr}
.walk a.m{color:var(--amber-d);font-weight:700}
.rem{border-left:5px solid var(--amber)}.rem .body{padding:14px 16px}.rem h2{font-size:17px}.rem p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--card);border-radius:999px;box-shadow:0 6px 22px rgba(20,24,40,.2);display:flex;gap:2px;padding:6px 8px;border:1px solid var(--line)}
nav span{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:6px 10px;border-radius:999px;color:var(--mut);font-size:11px;font-weight:600}nav span i{font-style:normal;font-size:19px}
nav span.on{background:var(--peach);color:var(--amber-d)}
</style></head><body>
<div class="stage">
<div class="col"><p class="lab"><span>1</span> · Home – banner pinned, all four clubs already listed</p><div class="phone" id="p1"></div></div>
<div class="col"><p class="lab"><span>2</span> · Club selected – tap the bar to switch clubs</p><div class="phone" id="p2"></div></div>
<div class="col"><p class="lab"><span>3</span> · Club selected – Bertusew with walk</p><div class="phone" id="p3"></div></div>
</div>

function detail(c){

 const rows=a=>`<ul class="rows">${a.map(r=>`<li><span class="k">${r[0]}</span><span class="v">${r[1]}</span></li>`).join("")}</ul>`;
 const walk=c.walk?`<div class="walk"><h3>🚶 Wednesday Evening Walk</h3><p class="n">Previous announcement – not verified as upcoming. Check Telegram for the next walk’s date.</p>${rows([["Date","18/02/2019 (Ethiopian calendar)"],["Meet","12:00"],["Departs","12:35"],["Meet at","ፒያሳ መኮንን ባቅላባ ቤት · <a class='m' href='https://maps.app.goo.gl/5YEbz5rm8hppxf8p6?g_st=ipc' target='_blank' rel='noopener'>View map</a>"],["Distance","2–3 km · about 30–40 minutes"],["Wear","Comfortable clothing and shoes"]])}<a class="btn o" href="${TG}bertusewrunningclub" target="_blank" rel="noopener" data-ext>Check Telegram for the Next Walk</a></div>`:"";

 }

 });
 r();
}
