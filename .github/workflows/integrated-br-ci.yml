name: Integrated branch CI (Phases A–F)

# Feature-branch companion to the standing `ci.yml`. It only runs for
# `feature/circler-chat-experience` and for PRs that target `dev`; dev/main keep
# their existing workflows. No hosted staging credentials are required — the
# Postgres job uses a local service database that CI creates and drops itself.
on:
  push:
    branches: [feature/circler-chat-experience]
  pull_request:
    branches:
      - feature/circler-chat-experience
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ------------------------------------------------------------------ backend
  # The full FastAPI suite with a disposable Postgres service. This includes
  # identity consistency, Telegram/Google linking, the reconciliation dry runs,
  # rate limiting, CORS/security headers and the end-to-end journeys.
  backend:
    name: backend · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Create disposable live-test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "ci_live_tests"'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q app api
        working-directory: backend
      - name: Full test suite
        run: pytest app/tests -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci
          TELEGRAM_BOT_TOKEN: ${{ github.run_id }}
          JWT_SECRET: ${{ github.run_id }}
          DISPOSABLE_DB: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci_live_tests
          PYTHONUNBUFFERED: '1'
      # Local SQLite-only smoke check (no external service dependency).
      - name: SQLite-only smoke check
        run: pytest app/tests/test_security_headers_cors.py app/tests/test_rate_limit.py app/tests/test_identity_end_to_end.py -q
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_smoke.db
          TELEGRAM_BOT_TOKEN: ${{ github.run_id }}
          JWT_SECRET: ${{ github.run_id }}

  # ---------------------------------------------------------- migrations
  # Implements the documented pre-032 simulation (no historical baseline).
  # A service matrix creates a minimal post-032 DB, then stamps exactly 032
  # and upgrades to head; revision tests cover drift, idempotency and downgrade.
  migrations:
    name: migrations · chain 032 → 035
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt alembic
        working-directory: backend
      - name: Create disposable live-test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "ci_live_tests"'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci
      - name: Simulate post-032 schema and upgrade to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci
          TELEGRAM_BOT_TOKEN: ${{ github.run_id }}
          JWT_SECRET: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # This user table has exactly what revisions 033–035 participate with.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "DROP TABLE IF EXISTS auth_identities, account_link_challenges, api_rate_limits CASCADE;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS users (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), telegram_id BIGINT NULL UNIQUE, created_at timestamptz NOT NULL DEFAULT now());"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO users (id, telegram_id) VALUES ('11111111-1111-1111-1111-111111111111', 555000111), ('22222222-2222-2222-2222-222222222222', 555000222);"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(32) PRIMARY KEY); TRUNCATE alembic_version; INSERT INTO alembic_version VALUES ('032');"
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic current | head -n 1 | grep '^035 (head)' >/dev/null || {
            echo "unexpected current revision:"; python -m alembic current; exit 1;
          }

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\d+ auth_identities"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\d+ account_link_challenges"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\d+ api_rate_limits"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT indexname FROM pg_indexes WHERE tablename IN ('auth_identities','account_link_challenges','api_rate_limits') ORDER BY 1;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT conname, convalidated FROM pg_constraint WHERE conrelid IN ('auth_identities'::regclass,'account_link_challenges'::regclass,'api_rate_limits'::regclass) ORDER BY conname;"
      - name: Revision chain, drift and downgrade drills
        run: pytest app/tests/test_auth_identities_migration.py app/tests/test_account_link_challenges_migration.py app/tests/test_api_rate_limits_migration.py -q
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
          TELEGRAM_BOT_TOKEN: ${{ github.run_id }}
          JWT_SECRET: ${{ github.run_id }}
          DISPOSABLE_DB: postgresql://postgres:${{ github.run_id }}@localhost:5432/ci_live_tests
          PYTHONUNBUFFERED: '1'

  # --------------------------------------------------------------- chatbot
  # Covers conversation ownership, anonymous sessions, invalid/expired JWT
  # behavior, ISO memory contracts, and the Phase E continuity tests.
  chatbot:
    name: chatbot · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            chatbot/requirements.txt
            chatbot/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: chatbot
      - name: Chatbot suite
        run: pytest -q
        working-directory: chatbot
      - name: Static migration checks
        run: python migration_check.py
        working-directory: chatbot
      - name: Quality evaluations
        run: python quality_eval.py
        working-directory: chatbot
      - name: Ownership + linked identity continuity subset
        run: pytest test_ownership.py test_linked_identity_continuity.py test_memory.py test_auth.py -q
        working-directory: chatbot
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q -x 'loadtest|__pycache__' .
        working-directory: chatbot

  # -------------------------------------------------------------- frontend
  frontend-lint:
    name: frontend · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-test:
    name: frontend · full default suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  frontend-build:
    name: frontend · Mini App production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  web-tests:
    name: web · API/UI/parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            wellcircle-web/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: wellcircle-web
      - run: npm run test:web
        working-directory: frontend

  web-build:
    name: website · production build + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            wellcircle-web/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: wellcircle-web
      - run: npm run check:parity
        working-directory: wellcircle-web
      - run: npm run build
        working-directory: wellcircle-web

  # ---------------------------------------------------------------- browser
  # Placeholder only: no Playwright/real-browser runtime exists in this repo.
  # Real staged-provider E2E belongs to a separately run staging job.
  browser-staging:
    name: browser · hosted staging E2E
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Not configured
        run: |
          echo "Browser E2E is intentionally not part of ordinary CI."
          echo "It would require real provided bot/browser credentials, a hosted"
          echo "staging project and network access. Compared with the documented"
          echo "mock-auth Vitest suites, this is still a separate staging gate."

  # ------------------------------------------------------------------ security
  security-artifacts:
    name: security · dependency audit + tracked-secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Audit web
        run: npm audit --audit-level=high
        working-directory: wellcircle-web
      - name: Refuse tracked private keys/env-like secret files
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.env\b|\.env\.[^.]+$|\.pem$|\.key$' | grep -vi 'example\|\.env\.production' >/dev/null 2>&1; then
            echo 'A non-example env/credential-shaped file would be committed.'; exit 1
          fi
          if grep -RIlE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=node_modules --exclude=package-lock.json . >/dev/null 2>&1; then
            echo 'A tracked private key-like blob was found.'; exit 1
          fi
